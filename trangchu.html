<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YaMe UNIFORM</title>
    <link rel="stylesheet" href="/assets/css/trangchu.css">
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
</head>
<body>
    <header class="header">
        <nav class="nav">
            <button class="menu-toggle">
                <i class="ti ti-menu-2"></i>
            </button>

            <div class="nav-logo">
                <a href="trangchu.html">
                    <img src="/assets/images/logo_YaMe_2025.avif" alt="logo">
                </a>
            </div>
            <ul class="nav-links" id="nav-links-menu">
                <li class="mobile-close-item">
                    <button class="close" title="Đóng menu">
                        <i class="ti ti-x"></i>
                    </button>
                </li>
                <li class="links"> <a href="trangchu.html">TRANG CHỦ</a></li>
                <li class="links"> <a href="#">DANH MỤC SẢN PHẨM</a></li>
                <li class="links"> <a href="#">GIỚI THIỆU</a></li>
            </ul>
            <div class="nav-icons">
            <a href="#giohang" title="Giỏ hàng" style="position: relative;">
                <i class="ti ti-shopping-bag"></i>
                <span class="giohang-notif">0</span>
            </a>
            <a href="#dangnhap" id="user-account-btn" title="Tài khoản">
                <i class="ti ti-user"></i>
            </a>
        </div>
        </nav>
    </header>
    
    <main>
        <section class="banner-img"></section>
        <section class="social-contact">
            <h2><a href="#"><i class="ti ti-brand-facebook"></i>
            <span>FACEBOOK</span>
        </a>
    </h2>
            <h2><a href="#"><i class="ti ti-brand-instagram"></i>
            <span>INSTAGRAM</span>
        </a>
    </h2>
            <h2><a href="#"><i class="ti ti-brand-tiktok"></i>
            <span>TIKTOK</span>
        </a>
    </h2>
            <h2><a href="#"><i class="ti ti-brand-youtube"></i>
            <span>YOUTUBE</span>
        </a>
    </h2>
            <h2><a href="#"><i class="ti ti-mail"></i>
            <span>GMAIL</span>
        </a>
    </h2>
        </section>
        <section class="danhmucsp">
            <div class="sp shirt">
                <img src="/assets/images/aothun.jpg" alt="aothun">
                <div class="overlay">
                    <h2>ÁO THUN</h2>
                </div>
            </div>
            <div class="sp sport-shirt">
                <img src="/assets/images/aothethao.jpeg" alt="aothethao">
                <div class="overlay">
                    <h2>ÁO THỂ THAO</h2>
                </div>
            </div>
            <div class="sp pants">
                <img src="/assets/images/kaki.jpg" alt="quanthun">
                <div class="overlay">
                    <h2>ÁO KAKI</h2>
                </div>
            </div>
            <div class="sp short-pants">
                <img src="/assets/images/short-pants.jpeg" alt="quanthun">
                <div class="overlay">
                    <h2>QUẦN THUN NGẮN</h2>
                </div>
            </div>
            <div class="sp sport-pants">
                <img src="/assets/images/quantheao.jpg" alt="quanthethao">
                <div class="overlay">
                    <h2>QUẦN THỂ THAO</h2>
                </div>
            </div>
            <div class="sp jeans">
                <img src="/assets/images/jeans.jpeg" alt="jeans">
                <div class="overlay">
                    <h2>QUẦN JEANS</h2>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
