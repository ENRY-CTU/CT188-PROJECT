<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập | Maison Mode</title>
    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="shortcut icon" href="assets/images/favicon.ico" type="image/x-icon">
</head>
<body>
    <main class="container">

        <div class="form-container" id="login-form">

            <div class="form-header">
                <p>Vui lòng nhập thông tin</p>
                <h1>Xin chào!</h1>
            </div>

            <form class="form-box" novalidate>
                <div class="input-group">
                    <input type="email" id="email" class="input-field" placeholder=" " required>
                    <label for="email" class="floating-label">Địa chỉ Email</label>
                </div>

                <div class="input-group">
                    <input type="password" id="password" class="input-field" placeholder=" " required>
                    <label for="password" class="floating-label">Mật khẩu</label>
                    <div class="eye-icon">👁</div>
                </div>

                <div class="input-group checkbox-group">
                    <div class="form-col remember-me">
                        <input type="checkbox" id="remember-me-checkbox" class="checkbox-field">
                        <label for="remember-me-checkbox">Lưu thông tin</label>
                    </div>

                    <div class="form-col">
                        <a href="#" class="form-link">Quên mật khẩu?</a>
                    </div>
                </div>

                <button type="submit" class="form-btn form-btn--submit">ĐĂNG NHẬP</button>
            </form>

            <div class="form-divider">
                <p>Hoặc</p>
            </div>

            <div class="form-bottom">
                <div class="form-socials">
                    <button type="button" class="form-btn form-btn--social">
                        <img src="assets/images/google.jpg" class="btn-icon" alt="Google">
                    </button>

                    <button type="button" class="form-btn form-btn--social">
                        <img src="assets/images/facebook.jpg" class="btn-icon" alt="Facebook">
                    </button>
                </div>

                <p>Không có tài khoản?<a href="#" class="form-link" onclick="showRegister(); return false;">ĐĂNG KÝ</a></p>
            </div>

        </div>

        <div class="form-container" id="register-form" style="display: none;">

            <div class="form-header">
                <p>Vui lòng nhập thông tin</p>
                <h1>Tạo tài khoản!</h1>
            </div>

            <form class="form-box" novalidate>

                <div class="input-group">
                    <input type="text" id="fullname" class="input-field" placeholder=" " required>
                    <label for="fullname" class="floating-label">Họ và tên</label>
                </div>

                <div class="input-group">
                    <input type="email" id="register-email" class="input-field" placeholder=" " required>
                    <label for="register-email" class="floating-label">Địa chỉ Email</label>
                </div>

                <div class="input-group">
                    <input type="password" id="register-password" class="input-field" placeholder=" " required>
                    <label for="register-password" class="floating-label">Mật khẩu</label>
                    <div class="eye-icon">👁</div>
                </div>

                <div class="input-group">
                    <input type="password" id="confirm-password" class="input-field" placeholder=" " required>
                    <label for="confirm-password" class="floating-label">Xác nhận mật khẩu</label>
                    <div class="eye-icon">👁</div>
                </div>

                <div class="input-group">
                    <input type="text" id="address" class="input-field" placeholder=" " required>
                    <label for="address" class="floating-label">Địa chỉ</label>
                </div>

                 <div class="input-group">
                    <input type="text" id="phone-number" class="input-field" placeholder=" " required>
                    <label for="phone-number" class="floating-label">Số điện thoại</label>
                </div>

                <button type="submit" class="form-btn form-btn--submit">ĐĂNG KÝ</button>

            </form>

            <div class="form-divider">
                <p>Hoặc</p>
            </div>

            <div class="form-bottom">
                <div class="form-socials">
                    <button type="button" class="form-btn form-btn--social">
                        <img src="assets/images/google.jpg" class="btn-icon" alt="Google">
                    </button>

                    <button type="button" class="form-btn form-btn--social">
                        <img src="assets/images/facebook.jpg" class="btn-icon" alt="Facebook">
                    </button>
                </div>

                <p>Đã có tài khoản?
                    <a href="#" class="form-link" onclick="showLogin(); return false;">ĐĂNG NHẬP</a>
                </p>
            </div>
        </div>
    </main>
    <script src="assets/js/login.js"></script>
</body>


</html>
